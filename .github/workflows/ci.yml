name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.asbrokers.co.za

  accessibility:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.asbrokers.co.za

      - name: Run WCAG accessibility tests (axe-core)
        run: npx playwright test tests/accessibility.spec.ts
        env:
          CI: true
          PLAYWRIGHT_PORT: "3120"

      - name: Upload accessibility violation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-violations
          path: |
            test-results/accessibility-violations-summary.json
            test-results/accessibility-violations.json
            playwright-report/

  visual-regression:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.asbrokers.co.za

      - name: Run visual regression tests
        run: npx playwright test tests/visual.spec.ts
        env:
          CI: true
          PLAYWRIGHT_PORT: "3120"

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            tests/visual.spec.ts-snapshots/

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.asbrokers.co.za

      - name: Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          CI: true
          LIGHTHOUSE_PORT: "3000"

      - name: Phase 9 performance verification
        run: npx tsx scripts/verify-phase9-performance.ts

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lhci-reports/
            .lighthouseci/

  seo-wrs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.asbrokers.co.za

      - name: Run SEO / WRS Playwright tests
        run: npm run test:seo
        env:
          CI: true
          PLAYWRIGHT_PORT: "3120"

      - name: Upload SEO test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seo-wrs-failures
          path: |
            test-results/
            playwright-report/

  master-audit:
    runs-on: ubuntu-latest
    needs: [build, accessibility, visual-regression, lighthouse, seo-wrs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Phase 12 master verification
        run: npm run test:master
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: https://www.asbrokers.co.za
          PLAYWRIGHT_PORT: "3120"
          LIGHTHOUSE_PORT: "3000"
